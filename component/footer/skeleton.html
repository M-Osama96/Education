<style>
  *,

  }
  [dir="rtl"] {

  .skeleton-container {

  }

  .skeleton-shimmer {
    position: relative;
    overflow: hidden;
    background: #e5e7eb;
  }
  .skeleton-shimmer::after {
    content: "";
    position: absolute;
    inset: 0;
    transform: translateX(calc(-100% * var(--sk-shimmer-dir)));
    background: linear-gradient(
      90deg,
      transparent,
      rgba(255, 255, 255, 0.5),

    );
    animation: skeleton-shimmer-animation 1.5s infinite;
