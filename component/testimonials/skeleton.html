<style>
  *,
  :before,
  :after {
    box-sizing: border-box;
    border: none;
    margin: 0;
  }
  :root {
    --sk-shimmer-dir: 1;
  }
  [dir="rtl"] {
    --sk-shimmer-dir: -1;
  }

  .skeleton-wrapper {
    height: fit-content;
    padding-block: 100px;
    width: 100%;
  }
  .skeleton-wrapper.sk-full-bg {
    background: rgba(229, 231, 235, 0.45);
  }

  .skeleton-container {
    padding-inline: 20px;
    margin-inline: auto;
    width: 100%;
    max-width: 1180px;
  }

  .skeleton-shimmer {
    position: relative;
    overflow: hidden;
    background: #e5e7eb;
  }
  .skeleton-shimmer::after {
    content: "";
    position: absolute;
    inset: 0;
    transform: translateX(calc(-100% * var(--sk-shimmer-dir)));
    background: linear-gradient(
      90deg,
      transparent,
      rgba(255, 255, 255, 0.5),
      transparent
    );
    animation: skeleton-shimmer-animation 1.5s infinite;
  }
  @keyframes skeleton-shimmer-animation {
    100% {
      transform: translateX(calc(100% * var(--sk-shimmer-dir)));
    }
  }
</style>
