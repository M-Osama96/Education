<style>
  /* =========================
   DEPARTMENTS SKELETON
========================= */

  .departments-skeleton {
    width: 100%;
    max-width: 1410px;
    margin: 0 auto;
    padding: 70px 0;
  }

  /* =========================
   SECTION TITLE
========================= */

  .sk-section-title {
    width: 400px;
    height: 48px;

    margin: 0 auto 85px;

    border-radius: 7px;
  }

  /* =========================
   CARDS WRAPPER
========================= */

  .sk-departments {
    display: grid;
    grid-template-columns: repeat(4, 1fr);

    gap: 38px;
  }

  /* =========================
   CARD
========================= */

  .sk-department-card {
    position: relative;

    width: 100%;
    height: 370px;

    padding: 28px 10px 10px;

    border: 1px solid #d9d9d9;
    border-radius: 24px;

    background: #f7f7f7;
  }

  /* =========================
   CARD HEADER
========================= */

  .sk-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    height: 50px;
    padding-left: 0;
  }

  /* =========================
   CARD TITLE
========================= */

  .sk-card-title {
    width: 205px;
    height: 25px;

    border-radius: 5px;
  }

  /* =========================
   ARROW
========================= */

  .sk-arrow {
    width: 60px;
    height: 60px;

    margin-right: -10px;

    border-radius: 50%;

    border: 1px solid #d2d2d2;

    background: #dedede;
  }

  /* =========================
   IMAGE
========================= */

  .sk-card-image {
    width: 100%;
    height: 278px;

    margin-top: 5px;

    border-radius: 18px;
  }

  /* =========================
   SHIMMER
========================= */

  .skeleton-shimmer {
    position: relative;

    background: #d0d0d0;

    overflow: hidden;
  }

  .skeleton-shimmer::after {
    content: "";

    position: absolute;

    top: 0;
    left: -150%;

    width: 100%;
    height: 100%;

    background: linear-gradient(
      90deg,
      transparent 0%,
      rgba(255, 255, 255, 0.5) 50%,
      transparent 100%
    );

    animation: skeleton-shimmer 1.5s infinite;
  }

  @keyframes skeleton-shimmer {
    100% {
      left: 150%;
    }
  }

  /* =========================
   RESPONSIVE
========================= */

  @media (max-width: 1200px) {
    .departments-skeleton {
      padding-inline: 30px;
    }

    .sk-departments {
      grid-template-columns: repeat(3, 1fr);
    }
  }

  @media (max-width: 900px) {
    .sk-departments {
      grid-template-columns: repeat(2, 1fr);
    }

    .sk-section-title {
      margin-bottom: 55px;
    }
  }

  @media (max-width: 600px) {
    .departments-skeleton {
      padding: 45px 20px;
    }

    .sk-section-title {
      width: 230px;
      height: 38px;

      margin-bottom: 45px;
    }

    .sk-departments {
      grid-template-columns: 1fr;
      gap: 25px;
    }

    .sk-department-card {
      height: 350px;
    }

    .sk-card-image {
      height: 260px;
    }
  }
</style>
