<!doctype html>
<html dir="rtl" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=no"
    />
    <title>department</title>
    <link rel="shortcut icon" type="img/png" href="images/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/line-awesome@1.3.0/dist/line-awesome/css/line-awesome.min.css
    "
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@6.0/dist/fancybox/fancybox.css"
    />
    <link rel="stylesheet" href="css/main.css" />
  </head>

  <body>
    <section class="departments">
      <div class="container">
        <div class="departments-cont">
          <div class="departments-title">الأقسام الأكاديمية</div>
          <div class="departments-items">
            <div class="departments-item">
              <div class="item-title">مرحلة رياض الأطفال</div>
              <div class="item-img">
                <img src="images/kg.png" class="img-cover" alt="" />
              </div>
              <div class="icon-box">
                <div class="icon">
                  <i class="las la-arrow-left"> </i>
                </div>
                <div class="radius"></div>
              </div>
            </div>
            <div class="departments-item">
              <div class="item-title">المرحلة الإبتدائية</div>
              <div class="item-img">
                <img src="images/primary.png" class="img-cover" alt="" />
              </div>
              <div class="icon-box">
                <div class="icon">
                  <i class="las la-arrow-left"> </i>
                </div>
                <div class="radius"></div>
              </div>
            </div>
            <div class="departments-item">
              <div class="item-title">المرحلة المتوسطة</div>
              <div class="item-img">
                <img src="images/high-scool.png" class="img-cover" alt="" />
              </div>
              <div class="icon-box">
                <div class="icon">
                  <i class="las la-arrow-left"> </i>
                </div>
                <div class="radius"></div>
              </div>
            </div>
            <div class="departments-item">
              <div class="item-title">المرحلة الثانوية</div>
              <div class="item-img">
                <img src="images/college.png" class="img-cover" alt="" />
              </div>
              <div class="icon-box">
                <div class="icon">
                  <i class="las la-arrow-left"> </i>
                </div>
                <div class="radius"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@6.0/dist/fancybox/fancybox.umd.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
