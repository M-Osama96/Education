<style>
  .skeleton-section {

  .advantages-grid {

  /* Card */

  .advantage-card {
    position: relative;

    min-height: 205px;
    padding: 48px 25px 25px;

    border-radius: 15px;
    background: rgba(228, 228, 228, 0.5);

    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  /* Icon */

  .skeleton-icon {
    position: absolute;
    top: -37px;

    width: 58px;
    height: 58px;

    border-radius: 50%;
  }

  /* Card title */

  .skeleton-card-title {
    width: 85%;
    height: 20px;
    border-radius: 5px;
  }

  /* Card text */

  .skeleton-card-text {
    width: 90%;
    height: 14px;
    border-radius: 5px;
  }

  .skeleton-card-text.short {
    width: 65%;
  }

  /* Skeleton */

  .skeleton {
    background: linear-gradient(
      90deg,
      rgba(255, 255, 255, 0.08) 25%,
      rgba(255, 255, 255, 0.2) 50%,
      rgba(255, 255, 255, 0.08) 75%
    );

    background-size: 200% 100%;

    animation: skeleton-shimmer 1.5s infinite;
  }

  .advantages-header .skeleton {
    background: linear-gradient(90deg, #e8e8e8 25%, #f7f7f7 50%, #e8e8e8 75%);

    background-size: 200% 100%;
  }

  @keyframes skeleton-shimmer {
    0% {
      background-position: 200% 0;
    }

    100% {
      background-position: -200% 0;
    }
  }
