      <div class="sk-feature-text skeleton-shimmer"></div>
      <div class="sk-feature-text w-70 skeleton-shimmer"></div>
    </div>

    <div class="sk-feature">
      <div class="sk-feature-title skeleton-shimmer"></div>

      <div class="sk-feature-text skeleton-shimmer"></div>
      <div class="sk-feature-text w-70 skeleton-shimmer"></div>
    </div>

    <div class="sk-feature">
      <div class="sk-feature-title skeleton-shimmer"></div>
      <div class="sk-feature-icon skeleton-shimmer"></div>

      <div class="sk-feature-text skeleton-shimmer"></div>
      <div class="sk-feature-text w-70 skeleton-shimmer"></div>
    </div>
  </div>
</section>
<style>
  /* =========================
   SKELETON
========================= */

  .about-skeleton {
    position: relative;
    max-width: 1210px;
    min-height: 760px;
    margin: 0 auto;
    padding: 60px 48px 120px;

    background: #f5f5f5;
    border: 1px solid #e1e1e1;
    border-radius: 40px;

    overflow: hidden;
  }

  /* =========================
   MAIN CONTENT
========================= */

  .about-skeleton-content {
    width: 52%;
    position: relative;
    z-index: 2;
  }

  .sk-heading-lg {
    width: 280px;
    height: 42px;
    margin-bottom: 45px;
    border-radius: 7px;
  }

  .sk-paragraph {
    width: 95%;
    height: 20px;
    margin-bottom: 14px;
    border-radius: 5px;
  }

  .sk-paragraph.second {
    margin-top: 30px;
  }

  .sk-button {
    width: 340px;
    height: 52px;
    margin-top: 38px;
    border-radius: 30px;
  }

  /* =========================
   VISUAL
========================= */

  .about-skeleton-visual {
    position: absolute;
    top: 50px;
    right: 45px;

    width: 42%;
    height: 500px;
  }

  .sk-circle {
    position: absolute;

    width: 485px;
    height: 485px;

    right: 0;
    top: 0;

    border-radius: 50%;
  }

  .sk-small-circle {
    position: absolute;

    width: 105px;
    height: 105px;

    left: 5px;
    bottom: 90px;

    border-radius: 50%;
  }

  /* =========================
   FEATURES
========================= */

  .sk-features {
    position: absolute;

    left: 48px;
    right: 48px;
    bottom: 55px;

    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 28px;
  }

  .sk-feature {
    position: relative;

    height: 200px;
    padding: 35px 25px;

    border: 1px solid #dcdcdc;
    border-radius: 50%;

    background: #f7f7f7;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .sk-feature-title {
    width: 80px;
    height: 28px;

    margin-bottom: 15px;

    border-radius: 5px;
  }

  .sk-feature-icon {
    position: absolute;

    width: 28px;
    height: 28px;

    top: 42px;
    right: 35px;

    border-radius: 5px;
  }

  .sk-feature-text {
    width: 120px;
    height: 18px;

    margin-bottom: 10px;

    border-radius: 5px;
  }

  /* =========================
   WIDTH HELPERS
========================= */

  .w-95 {
    width: 95%;
  }

  .w-90 {
    width: 90%;
  }

  .w-85 {
    width: 85%;
  }

  .w-75 {
    width: 75%;
  }

  .w-70 {
    width: 70%;
  }

  /* =========================
   SHIMMER
========================= */

  .skeleton-shimmer {
    position: relative;

    background: #d3d3d3;

    overflow: hidden;
  }

  .skeleton-shimmer::after {
    content: "";

    position: absolute;

    top: 0;
    left: -150%;

    width: 100%;
    height: 100%;

    background: linear-gradient(
      90deg,
      transparent 0%,
      rgba(255, 255, 255, 0.45) 50%,
      transparent 100%
    );

    animation: skeleton-shimmer 1.5s infinite;
  }

  @keyframes skeleton-shimmer {
    100% {
      left: 150%;
    }
  }

  /* =========================
   RESPONSIVE
========================= */

  @media (max-width: 991px) {
    .about-skeleton {
      padding: 45px 30px 100px;
    }

    .about-skeleton-content {
      width: 100%;
    }

    .about-skeleton-visual {
      position: relative;

      top: auto;
      right: auto;

      width: 100%;
      height: 350px;

      margin-top: 40px;
    }

    .sk-circle {
      width: 330px;
      height: 330px;

      right: 50%;
      transform: translateX(50%);
    }

    .sk-small-circle {
      width: 80px;
      height: 80px;

      left: calc(50% - 180px);
      bottom: 10px;
    }

    .sk-features {
      position: relative;

      left: auto;
      right: auto;
      bottom: auto;

      margin-top: 30px;

      grid-template-columns: repeat(3, 1fr);
    }
  }

  @media (max-width: 600px) {
    .about-skeleton {
      padding: 35px 20px 40px;
      border-radius: 25px;
    }

    .sk-heading-lg {
      width: 200px;
      height: 35px;
      margin-bottom: 30px;
    }

    .sk-paragraph {
      width: 100%;
    }

    .sk-button {
      width: 100%;
      margin-top: 25px;
    }

    .about-skeleton-visual {
      height: 280px;
    }

    .sk-circle {
      width: 260px;
      height: 260px;
    }

    .sk-small-circle {
      width: 65px;
      height: 65px;

      left: calc(50% - 145px);
    }

    .sk-features {
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .sk-feature {
      height: 150px;
      padding: 20px;
    }

    .sk-feature-icon {
      top: 25px;
      right: 20px;
    }
  }
</style>
