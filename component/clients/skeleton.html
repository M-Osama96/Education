<style>
  *,

  :after {

    border: none;
    margin: 0;
  }
  :root {

  }
  [dir="rtl"] {

  }

  .skeleton-wrapper {

    padding-block: 100px;
    width: 100%;
  }
  .skeleton-wrapper.sk-full-bg {

  .skeleton-shimmer {

    overflow: hidden;
    background: #e5e7eb;
  }
  .skeleton-shimmer::after {

    position: absolute;
    inset: 0;
    transform: translateX(calc(-100% * var(--sk-shimmer-dir)));
    background: linear-gradient(
      90deg,
      transparent,
      rgba(255, 255, 255, 0.5),
      transparent
    );
    animation: skeleton-shimmer-animation 1.5s infinite;
  }
  @keyframes skeleton-shimmer-animation {
    100% {
      transform: translateX(calc(100% * var(--sk-shimmer-dir)));
    }
  }
</style>
